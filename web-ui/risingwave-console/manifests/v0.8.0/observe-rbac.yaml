# Observe the single RisingWave CR risingwave-prod/rw-prod.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: risingwave-console-observe-rw-prod
  namespace: risingwave-prod
rules:
  - apiGroups: ["risingwave.risingwavelabs.com"]
    resources: ["risingwaves"]
    resourceNames: ["rw-prod"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: risingwave-console-observe-rw-prod
  namespace: risingwave-prod
subjects:
  - kind: ServiceAccount
    name: risingwave-console
    namespace: risingwave-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: risingwave-console-observe-rw-prod
