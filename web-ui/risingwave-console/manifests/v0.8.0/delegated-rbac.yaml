# Patch the single CR and read only the SQL and Meta Services.
# Keep observe-rbac.yaml applied separately for CR observation.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: risingwave-console-delegate-rw-prod
  namespace: risingwave-prod
rules:
  - apiGroups: ["risingwave.risingwavelabs.com"]
    resources: ["risingwaves"]
    resourceNames: ["rw-prod"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["rw-prod-frontend", "rw-prod-meta"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: risingwave-console-delegate-rw-prod
  namespace: risingwave-prod
subjects:
  - kind: ServiceAccount
    name: risingwave-console
    namespace: risingwave-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: risingwave-console-delegate-rw-prod
