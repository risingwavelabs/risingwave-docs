# RisingWave Console v0.8.0 quick-start with bundled PostgreSQL.
# The PVC below does not persist the bundled PostgreSQL metadata directory.
# Export the bundled database before replacing or rescheduling this pod.
apiVersion: v1
kind: Namespace
metadata:
  name: risingwave-console
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: risingwave-console
  namespace: risingwave-console
---
apiVersion: v1
kind: Secret
metadata:
  name: risingwave-console-secrets
  namespace: risingwave-console
type: Opaque
stringData:
  license.jwt: <your-signed-license-token>
  root-password: <strong-password>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: risingwave-console
  namespace: risingwave-console
spec:
  replicas: 1
  serviceName: risingwave-console
  selector:
    matchLabels:
      app.kubernetes.io/name: risingwave-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risingwave-console
    spec:
      serviceAccountName: risingwave-console
      # The image runs as UID/GID 1001 and creates
      # /risingwave-console-data/.risectl during startup. This requires a
      # storage driver that honors Kubernetes volume ownership management.
      # Otherwise, have the platform provide equivalent write permission.
      securityContext:
        fsGroup: 1001
      containers:
        - name: console
          image: risingwavelabs/risingwave-console:v0.8.0-pgbundle
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8020
            - name: metrics
              containerPort: 9020
          env:
            - name: RCONSOLE_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: risingwave-console-secrets
                  key: root-password
            - name: RW_LICENSE_KEY_PATH
              value: /etc/rconsole/license.jwt
            - name: RCONSOLE_SERVER_PORT
              value: "8020"
            - name: RCONSOLE_SERVER_METRICSPORT
              value: "9020"
          volumeMounts:
            - name: license
              mountPath: /etc/rconsole/license.jwt
              subPath: license.jwt
              readOnly: true
            - name: console-data
              mountPath: /risingwave-console-data
      volumes:
        - name: license
          secret:
            secretName: risingwave-console-secrets
  volumeClaimTemplates:
    - metadata:
        name: console-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: risingwave-console
  namespace: risingwave-console
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: risingwave-console
  ports:
    - name: http
      port: 8020
      targetPort: http
      nodePort: 30020
    - name: metrics
      port: 9020
      targetPort: metrics
      nodePort: 30090
