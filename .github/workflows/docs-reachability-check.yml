name: Docs Reachability Check

on:
  pull_request:

jobs:
  docs-reachability-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Check docs reachability
        run: node scripts/check-doc-reachability.mjs
